<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShahMation</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font-size: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px;
        margin-bottom: 8px;
        background: #f2f2f2;
      }
      .bar span {
        flex: 1;
      }
      button {
        padding: 8px 14px;
        font-size: 16px;
      }
      .panic {
        background: #b3261e;
        color: white;
        font-weight: bold;
        border: none;
      }
      input.note {
        width: 100px;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover {
        background: #f7f7f7;
      }
      .songs {
        max-height: 320px;
        overflow-y: auto;
      }
      th, td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <script src="/static/app.js"></script>
  </body>
</html>
